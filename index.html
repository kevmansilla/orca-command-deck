<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Source Control</title>
<link rel="stylesheet" href="./app.css" />
</head>
<body>
<header id="head">
  <div class="brand"><span class="logo">G</span>MULTI REPO GIT</div>
  <div class="right"><span class="zoom"><button id="zoomOut" class="bell" title="Achicar (Ctrl −)">A−</button><button id="zoomIn" class="bell" title="Agrandar (Ctrl +)">A+</button></span><button id="notify" class="bell" hidden></button><div class="live off" id="live"><span class="pdot"></span><span>conectando</span></div></div>
</header>
<nav id="tabs" role="tablist"></nav>
<div id="alerts"></div>
<div id="board" hidden><div class="inner" id="boardInner"></div></div>
<div id="git" hidden>
<aside id="side">
  <div id="top"><input id="find" placeholder="Buscar repos" aria-label="Buscar repos" /><div id="summary"></div></div>
  <div id="list"></div>
</aside>
<main id="main">
  <div id="bar"><button id="back" class="icon" title="Volver"></button><span id="title"></span></div>
  <div id="blank">Elegí un archivo o un commit</div>
  <pre id="diff" hidden></pre>
</main>
</div>
<div id="toast"></div>
<div id="modal"><div id="box"></div></div>
<script src="./app.js"></script>
</body>
</html>
